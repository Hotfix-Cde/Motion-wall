name: MotionWall APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore release signing key
        env:
          MOTIONWALL_KEYSTORE: ${{ secrets.MOTIONWALL_KEYSTORE }}
        run: |
          printf '%s' "$MOTIONWALL_KEYSTORE" | base64 --decode > motionwall-release.jks
          chmod 600 motionwall-release.jks
      - name: Build signed release APK
        env:
          MOTIONWALL_KEYSTORE_PATH: ${{ github.workspace }}/motionwall-release.jks
          MOTIONWALL_KEYSTORE_PASSWORD: ${{ secrets.MOTIONWALL_KEYSTORE_PASSWORD }}
          MOTIONWALL_KEY_ALIAS: ${{ secrets.MOTIONWALL_KEY_ALIAS }}
          MOTIONWALL_KEY_PASSWORD: ${{ secrets.MOTIONWALL_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK was produced"
            exit 1
          fi
          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MotionWall-release
          path: ${{ steps.apk.outputs.path }}
      - name: Publish or update GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --title "MotionWall $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Remove signing key
        if: always()
        run: rm -f motionwall-release.jks
